[package]
name = "nds_native"
version = "0.0.1-alpha.22"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"
[lib]
crate-type = ["cdylib", "staticlib"]
[features]
default = ["flutter"]
flutter = ["dep:flutter_rust_bridge"]
browser-bindings = ["dep:tsify", "serde/derive", "nddev-device-sync-accounts/browser-bindings", "nddev-device-sync-organizations/browser-bindings", "nddev-device-sync-vault/browser-bindings", "nddev-device-sync-telemetry/browser-bindings"]
development-http = ["nddev-device-sync-accounts/development-http"]
[dependencies]
nddev-device-sync-organizations = { git = "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-organizations", rev = "9a9a034974c1c85f8c86012c31069d1a09edae2f" }
nddev-device-sync-application = { git = "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-core.git", rev = "63caf93c1e431c4cbc74414f797ab836083db23e" }
nddev-device-sync-vault = { git = "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-vault", rev = "f022c2e900936091eabd9bb2d766ef01cb52caf7" }
tokio = { version = "1.53", features = ["sync", "rt", "time"] }
zeroize = "1.8"
tokio-util = { version = "0.7", features = ["rt"] }
flutter_rust_bridge = { optional=true, version="=2.13.0",default-features=false,features=["anyhow","dart-opaque","portable-atomic","rust-async","thread-pool"] }
nddev-device-sync-accounts = { git = "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-accounts", rev = "6aebbf2e1826fc2de5d3883549af6a53d232951f" }
nddev-device-sync-domain = {git="https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-core.git", rev = "63caf93c1e431c4cbc74414f797ab836083db23e"}
time = {version="0.3",features=["parsing","wasm-bindgen"]}
tracing = "0.1"
serde_json = "1"
serde = "1"
uuid = { version="1.27", features=["v4", "v7"] }
nddev-device-sync-agent = { git = "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-agent", rev = "0fdd48e38b655a079f95e2904a5597a64aa3be08" }
nddev-device-sync-sysinfo = { git = "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-sysinfo", rev = "92cf2d9922d3753f65f2514ee1e79f8fff57293f" }
nddev-device-sync-clipboard = { git = "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-clipboard", rev = "02a33d1e03b5ad216efbf6bf398a768e5e93ae0c" }
nddev-device-sync-cleaner = { git = "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-cleaner", rev = "191613987e172ad23e806b050d570b30acac0260" }
nddev-device-sync-updater = { git = "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-updater", rev = "f4946ef582e0d939147fad1d38d143f1f0c96ab0" }
nddev-device-sync-gds = { git = "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-gds", rev = "ca65b2bc0f531c02522bc2aa460e1856e34839d5", features = ["github-catalog"] }
nddev-device-sync-rds = { version = "=0.0.1-alpha.2", git = "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-rds", rev = "00c0329ee0f689346cde9f33911837f1f2b849d4", features = ["owned-screen"] }
nddev-device-sync-telemetry = { git = "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-observability", rev = "32f21f8a8f9c313bee9dcd1769c042133b5520da", features = ["client-traces"] }
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22.4"
jni-legacy = { package = "jni", version = "0.21.1" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tsify = { version = "=0.5.8", default-features = false, features = ["js"], optional = true }
wasm-bindgen="=0.2.129"
wasm-bindgen-futures="=0.4.79"
js-sys="=0.3.106"
uuid = { version="1.27",features=["js"] }

[target.'cfg(target_os = "linux")'.dependencies]
rds-net = { version = "=0.1.0", git = "https://github.com/NDDev-Technocracy-OpenNetwork/remote-device-sync", rev = "2761dbdb76baee0edc2557b02ac7a90472312ab7", default-features = false }

rds-core = { version = "=0.1.0", git = "https://github.com/NDDev-Technocracy-OpenNetwork/remote-device-sync", rev = "2761dbdb76baee0edc2557b02ac7a90472312ab7", default-features = false }
rds-desktop = { version = "=0.1.0", git = "https://github.com/NDDev-Technocracy-OpenNetwork/remote-device-sync", rev = "2761dbdb76baee0edc2557b02ac7a90472312ab7", default-features = false, features = ["x11"] }
