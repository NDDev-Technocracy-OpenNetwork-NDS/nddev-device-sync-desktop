name: nds_ui
description: Shared NDDev OpenNetwork presentation for desktop, mobile and web clients.
version: 0.0.1-alpha.23
publish_to: none
environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  cupertino_icons: 2.0.0
  nds_native:
    path: ../nds_native
  nddev_opennetwork_design_system:
    git:
      url: https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-opennetwork-design-system.git
      ref: 3d1fdea194a7ab8eb1928018f21512330a79cd43
      path: packages/flutter
  url_launcher: ^6.3.2
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  generate: true
  uses-material-design: true
