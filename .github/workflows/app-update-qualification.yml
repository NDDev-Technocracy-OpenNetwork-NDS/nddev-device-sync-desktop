name: app-update-qualification

on:
  workflow_dispatch:
    inputs:
      port:
        description: 'Owned loopback qualification server port (1024..65535)'
        type: string
        default: '18475'
        required: true

permissions: {}

concurrency:
  group: app-update-qualification
  cancel-in-progress: false

jobs:
  fixture:
    if: github.ref == 'refs/heads/main' && github.repository_id == '1412610357'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.15.0'
      - name: Generate opaque candidate and qualification policy
        env:
          QUALIFICATION_PORT: ${{ inputs.port }}
        run: |
          python -I scripts/make-app-update-fixture.py \
            --port "$QUALIFICATION_PORT" --output "$RUNNER_TEMP/nds-app-update"
      - name: Authenticate the exact manifest bytes
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ runner.temp }}/nds-app-update/app-release.json
      - name: Keep the portable verification bundle
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp -- "$BUNDLE_PATH" "$RUNNER_TEMP/nds-app-update/app-release.sigstore.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nds-app-update-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nds-app-update
          if-no-files-found: error
          retention-days: 7
