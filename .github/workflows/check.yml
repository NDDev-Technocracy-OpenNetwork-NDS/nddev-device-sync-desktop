name: NDS checks

on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_BUILD_JOBS: 4
  GH_TOKEN: ${{ github.token }}

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.15.0'
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3
        with:
          just-version: '1.59.0'
      - run: python scripts/bootstrap-ci.py
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
      - name: Restore the Cargo dependency and tool cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: contracts
          add-job-id-key: "false"
          workspaces: packages/nds_native/rust -> target
          cache-directories: build/nds-native
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Native library build dependencies
        run: |
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_OS /usr/bin/python3 -I scripts/prefer-ubuntu-https.py &&
          sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libclang-dev libssl-dev libx11-dev nasm libsecret-1-dev
      - run: cargo install --locked --version 1.0.127 cargo-expand
      - name: Install verified bridge generator
        run: |
          curl --fail --location --retry 2 --max-time 120 https://github.com/fzyzcjy/flutter_rust_bridge/releases/download/v2.13.0/flutter_rust_bridge_codegen-x86_64-unknown-linux-gnu-v2.13.0.tgz -o "$RUNNER_TEMP/frb.tgz"
          echo "1bb088e6ea42782848ea6507ab745371dbde58c83abef137d3e1e68ce510d45b  $RUNNER_TEMP/frb.tgz" | sha256sum --check -
          mkdir "$RUNNER_TEMP/frb"
          tar -xf "$RUNNER_TEMP/frb.tgz" -C "$RUNNER_TEMP/frb"
          echo "$RUNNER_TEMP/frb" >> "$GITHUB_PATH"
      - run: flutter pub get --enforce-lockfile
      - run: flutter pub get --enforce-lockfile
        working-directory: packages/nds_ui
      - run: flutter pub get --enforce-lockfile
        working-directory: packages/nds_native
      - run: cargo install --locked --version 0.22.2 cargo-audit
      - run: cargo install --locked --version 0.20.2 cargo-deny
      - run: just generated-check
      - run: just check
      - run: rustup target add --toolchain 1.99.1 wasm32-unknown-unknown
      - run: just browser-check
      - id: design
        shell: bash
        run: |
          python - <<'PY'
          import json,os,re
          from pathlib import Path
          sha=json.loads(Path('generated/launcher-provenance.json').read_text())['source']['commit']
          assert re.fullmatch('[a-f0-9]{40}',sha)
          with open(os.environ['GITHUB_OUTPUT'],'a') as output: output.write('sha='+sha+'\n')
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NDDev-Technocracy-OpenNetwork-NDS/nddev-opennetwork-design-system
          ref: ${{ steps.design.outputs.sha }}
          path: vendor/design-system
          persist-credentials: false
      - run: python -m pip install --require-hashes -r vendor/design-system/tools/requirements-icons.txt
      - run: bash vendor/design-system/tools/with-renderer-zlib.sh python vendor/design-system/tools/generate_launchers.py --desktop . --check
      - run: python -S vendor/design-system/tools/generate_launchers.py --desktop . --verify
