name: main-ci

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      linux_cache_port:
        description: 'Owner-supplied Linux loopback cache port; empty leaves cache unconfigured'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: main-validation
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: 4
  GH_TOKEN: ${{ github.token }}

jobs:
  contracts:
    runs-on: ubuntu-24.04
    env:
      # Lean check builds only; release and app builds keep their profiles.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.15.0'
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3
        with:
          just-version: '1.59.0'
      - run: python scripts/bootstrap-ci.py
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
      - name: Restore the Cargo dependency and tool cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: contracts
          add-job-id-key: "false"
          workspaces: packages/nds_native/rust -> target
          cache-directories: build/nds-native
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Native library build dependencies
        run: |
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_OS /usr/bin/python3 -I scripts/prefer-ubuntu-https.py &&
          sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libclang-dev libssl-dev libx11-dev nasm libsecret-1-dev
      - run: cargo install --locked --version 1.0.127 cargo-expand
      - name: Install verified bridge generator
        run: |
          curl --fail --location --retry 2 --max-time 120 https://github.com/fzyzcjy/flutter_rust_bridge/releases/download/v2.13.0/flutter_rust_bridge_codegen-x86_64-unknown-linux-gnu-v2.13.0.tgz -o "$RUNNER_TEMP/frb.tgz"
          echo "1bb088e6ea42782848ea6507ab745371dbde58c83abef137d3e1e68ce510d45b  $RUNNER_TEMP/frb.tgz" | sha256sum --check -
          mkdir "$RUNNER_TEMP/frb"
          tar -xf "$RUNNER_TEMP/frb.tgz" -C "$RUNNER_TEMP/frb"
          echo "$RUNNER_TEMP/frb" >> "$GITHUB_PATH"
      - run: flutter pub get --enforce-lockfile
      - run: flutter pub get --enforce-lockfile
        working-directory: packages/nds_ui
      - run: flutter pub get --enforce-lockfile
        working-directory: packages/nds_native
      - name: Install verified prebuilt Rust quality tools
        uses: NDDev-Technocracy-Standarts/std-0004-ci-cd-workflows/.github/actions/tools@365415f32190ae22ff22462e791a4829ad6e91fc # nddev-cicd-v0.6.16
        with:
          # cargo-audit 0.22.2, cargo-deny 0.20.2 and cargo-nextest 0.9.149 from checksummed
          # releases instead of compiling them with cargo install in every job.
          capability: rust
      - run: just generated-check
      - run: just check
      - run: rustup target add --toolchain 1.99.1 wasm32-unknown-unknown
      - run: just browser-check
      - id: design
        shell: bash
        run: |
          python - <<'PY'
          import json,os,re
          from pathlib import Path
          sha=json.loads(Path('generated/launcher-provenance.json').read_text())['source']['commit']
          assert re.fullmatch('[a-f0-9]{40}',sha)
          with open(os.environ['GITHUB_OUTPUT'],'a') as output: output.write('sha='+sha+'\n')
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NDDev-Technocracy-OpenNetwork-NDS/nddev-opennetwork-design-system
          ref: ${{ steps.design.outputs.sha }}
          path: vendor/design-system
          persist-credentials: false
      - run: python -m pip install --require-hashes -r vendor/design-system/tools/requirements-icons.txt
      - run: bash vendor/design-system/tools/with-renderer-zlib.sh python vendor/design-system/tools/generate_launchers.py --desktop . --check
      - run: python -S vendor/design-system/tools/generate_launchers.py --desktop . --verify

  builds:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux
            mode: release
            artifact: build/linux/x64/release/bundle
          - os: macos-15
            target: macos
            artifact: build/macos/Build/Products/Debug
          - os: macos-15-intel
            target: macos
            artifact: build/macos/Build/Products/Debug
          - os: windows-2022
            target: windows
            artifact: build/windows/x64/runner/Debug
    runs-on: ${{ matrix.os }}
    # Cold Intel setup plus the bounded 30-minute native build needs room for
    # artifact verification and cleanup; the other targets retain their budget.
    timeout-minutes: ${{ matrix.os == 'macos-15-intel' && 45 || 35 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.15.0'
      - id: design
        shell: bash
        run: |
          python - <<'PY'
          import json,os,re
          from pathlib import Path
          sha=json.loads(Path('generated/launcher-provenance.json').read_text())['source']['commit']
          assert re.fullmatch('[a-f0-9]{40}',sha)
          with open(os.environ['GITHUB_OUTPUT'],'a') as output: output.write('sha='+sha+'\n')
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NDDev-Technocracy-OpenNetwork-NDS/nddev-opennetwork-design-system
          ref: ${{ steps.design.outputs.sha }}
          path: vendor/design-system
          persist-credentials: false
      - run: python -S vendor/design-system/tools/generate_launchers.py --desktop . --verify
      - run: python scripts/bootstrap-ci.py
      - run: rustup toolchain install 1.99.1 --profile minimal
      - name: Native Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_OS /usr/bin/python3 -I scripts/prefer-ubuntu-https.py &&
          sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libclang-dev libssl-dev libx11-dev nasm libsecret-1-dev
      - name: Native macOS targets
        if: runner.os == 'macOS'
        run: rustup target add --toolchain 1.99.1 aarch64-apple-darwin x86_64-apple-darwin
      - run: flutter pub get --enforce-lockfile
      - run: flutter pub get --enforce-lockfile
        working-directory: packages/nds_ui
      - run: flutter pub get --enforce-lockfile
        working-directory: packages/nds_native
      - run: flutter analyze --no-pub
      - name: Build with the explicit target assembly
        shell: bash
        env:
          NDS_NATIVE_BUILD_HOME: ${{ runner.temp }}/nds-native
          NDS_BUILD_TARGET: ${{ matrix.target }}
          NDS_BUILD_MODE: ${{ matrix.mode || 'debug' }}
          NDS_ASSEMBLY_CACHE_PORT: ${{ matrix.target == 'linux' && inputs.linux_cache_port || '' }}
        run: |
          python - <<'PY'
          import os, subprocess, sys
          from pathlib import Path
          sys.dont_write_bytecode = True
          sys.path.insert(0, str(Path('packages/nds_native/tool').resolve()))
          from cache_assembly import cache_port
          command = [sys.executable, 'scripts/build.py', os.environ['NDS_BUILD_TARGET'],
                     '--' + os.environ['NDS_BUILD_MODE']]
          value = os.environ['NDS_ASSEMBLY_CACHE_PORT']
          if value:
              command.append('--dart-define=NDS_CACHE_PORT=' + str(cache_port(value)))
          subprocess.run(command, check=True)
          PY
      - run: python scripts/check-artifact.py '${{ matrix.artifact }}' --native-source-commit '${{ github.sha }}'
      - run: python scripts/build-provenance.py '${{ matrix.artifact }}' --build-kind '${{ matrix.mode || 'debug' }}' --output build/nds-build-provenance.json
      - name: Read compiled owning format metadata
        if: runner.os == 'Linux'
        id: native-metadata
        env:
          NDS_NATIVE_BUILD_HOME: ${{ runner.temp }}/nds-native
          NDS_SOURCE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, re, subprocess, sys
          from pathlib import Path
          sys.dont_write_bytecode = True
          sys.path.insert(0, str(Path('packages/nds_native/tool').resolve()))
          from prepare_native import build_environment
          # The ordinary build just verified these inputs. Consume the same
          # configured source/provider receipts without another refresh.
          env = build_environment(configured=True)
          # Match the release hook's declared inputs instead of creating a
          # second host-only compilation graph for the metadata example.
          env['NDS_APP_UPDATE_POLICY'] = ''
          manifest = str(Path('packages/nds_native/rust/Cargo.toml').resolve())
          metadata = json.loads(subprocess.check_output(
              ['cargo', 'metadata', '--locked', '--format-version', '1', '--manifest-path', manifest],
              env=env, text=True, timeout=120))
          workers = [p for p in metadata['packages'] if p['name'] == 'nddev-device-sync-github']
          if len(workers) != 1:
              raise SystemExit('One locked GitHub module worker source is required')
          provenance = json.loads(Path('build/nds-build-provenance.json').read_text())
          worker = provenance['worker']
          if (provenance['app_source']['commit'] != os.environ['NDS_SOURCE_COMMIT'] or
              provenance['native_source']['commit'] != os.environ['NDS_SOURCE_COMMIT'] or
              worker['source'] != workers[0]['source'] or
              worker['target'] != 'x86_64-unknown-linux-gnu' or
              not isinstance(worker['sha256'], str) or
              not re.fullmatch('[a-f0-9]{64}', worker['sha256'])):
              raise SystemExit('Metadata worker input differs from the verified native bundle')
          env['NDS_GITHUB_WORKER_SHA256'] = worker['sha256']
          env['CARGO_BUILD_BUILD_DIR'] = metadata.get('build_directory', metadata['target_directory'])
          result = subprocess.check_output(
              ['cargo', 'run', '--locked', '--release', '--manifest-path', manifest,
               '--target', 'x86_64-unknown-linux-gnu',
               '--example', 'app_release_metadata', '--jobs', '4'],
              env=env, text=True, timeout=600)
          value = json.loads(result)
          if value.get('source_commit') != os.environ['NDS_SOURCE_COMMIT']:
              raise SystemExit('Compiled metadata source differs from the native artifact')
          Path('build/nds-format-metadata.json').write_text(result)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('worker_source=' + str(Path(workers[0]['manifest_path']).parent) + '\n')
          PY
      - name: Select the existing verified native SPDX tool
        if: runner.os == 'Linux'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NDDev-Technocracy-Standarts/std-0004-ci-cd-workflows
          ref: ea492e553862c0638341f8b41d5455427f680174
          path: vendor/ci-standard
          persist-credentials: false
      - name: Prepare the checksum-pinned SPDX tool
        if: runner.os == 'Linux'
        run: bash vendor/ci-standard/scripts/prepare-release-tools.sh
      - name: Prepare the native qualification artifact once
        if: runner.os == 'Linux'
        run: |
          python scripts/make-native-app-release.py \
            --bundle '${{ matrix.artifact }}' --provenance build/nds-build-provenance.json \
            --formats build/nds-format-metadata.json \
            --worker-source '${{ steps.native-metadata.outputs.worker_source }}' \
            --version '1.0.0-alpha.${{ github.run_number }}' --port 18475 \
            --output "$RUNNER_TEMP/nds-native-candidate"
      - name: Retain the exact native qualification bytes
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nds-native-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/nds-native-candidate/app-release.json
            ${{ runner.temp }}/nds-native-candidate/payload
            ${{ runner.temp }}/nds-native-candidate/artifact-identity.json
          if-no-files-found: error
          retention-days: 1
      - name: Native qualification diagnostics
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nds-native-linux-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/nds-build-provenance.json
            build/nds-format-metadata.json
            ${{ runner.temp }}/nds-native-candidate/.work/*.log
          if-no-files-found: ignore
          retention-days: 1
      - name: Native macOS ARM window lifetime
        if: matrix.os == 'macos-15'
        run: python scripts/macos-window-acceptance.py '${{ matrix.artifact }}' --source '${{ github.sha }}' --evidence "$RUNNER_TEMP/nds-window-acceptance"
      - name: macOS window evidence
        if: always() && matrix.os == 'macos-15'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nds-macos-window-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nds-window-acceptance
          if-no-files-found: ignore
          retention-days: 7

  quality:
    if: always()
    needs: [contracts, builds]
    runs-on: ubuntu-24.04
    steps:
      - run: test '${{ needs.contracts.result }}' = success && test '${{ needs.builds.result }}' = success

  authenticate-native-candidate:
    needs: [quality]
    if: needs.quality.result == 'success' && github.ref == 'refs/heads/main' && github.repository_id == '1412610357'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.15.0'
      - name: Verify the exact current-run artifact and unchanged inner archive
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os, re, shutil, stat, subprocess, zipfile
          from pathlib import Path
          repo, run, attempt = (os.environ[name] for name in
                                ['GITHUB_REPOSITORY', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT'])
          endpoint = f'repos/{repo}/actions/runs/{run}/artifacts'
          pages = json.loads(subprocess.check_output(
              ['gh', 'api', '--paginate', '--slurp', endpoint], text=True, timeout=60))
          name = f'nds-native-linux-{run}-{attempt}'
          artifacts = [a for p in pages for a in p['artifacts'] if a['name'] == name]
          if len(artifacts) != 1 or artifacts[0]['expired']:
              raise SystemExit('One exact current-run native artifact is required')
          artifact = artifacts[0]
          lineage = artifact.get('workflow_run', {})
          if (lineage.get('id') != int(run) or lineage.get('repository_id') != 1412610357
                  or lineage.get('head_repository_id') != 1412610357
                  or lineage.get('head_branch') != 'main' or lineage.get('head_sha') != os.environ['GITHUB_SHA']
                  or type(artifact.get('size_in_bytes')) is not int
                  or not 0 < artifact['size_in_bytes'] <= 1024**3 + 1024**2):
              raise SystemExit('Native artifact lineage or size differs from this main run')
          digest = artifact.get('digest', '')
          if not re.fullmatch('sha256:[a-f0-9]{64}', digest):
              raise SystemExit('The Actions artifact has no immutable SHA256 identity')
          root = Path(os.environ['RUNNER_TEMP']) / 'nds-native-authentication'
          root.mkdir(mode=0o700)
          archive = root / 'actions.zip'
          with archive.open('xb') as output:
              subprocess.run(['gh', 'api', f'repos/{repo}/actions/artifacts/{artifact["id"]}/zip'],
                             stdout=output, check=True, timeout=240)
          with archive.open('rb') as source:
              if (archive.stat().st_size != artifact['size_in_bytes']
                      or hashlib.file_digest(source, 'sha256').hexdigest() != digest.removeprefix('sha256:')):
                  raise SystemExit('Actions ZIP digest differs from its exact artifact ID')
          with zipfile.ZipFile(archive) as package:
              entries = package.infolist()
              if sorted(e.filename for e in entries) != ['app-release.json', 'artifact-identity.json', 'payload']:
                  raise SystemExit('Unexpected native qualification ZIP members')
              for entry in entries:
                  limit = 1024**3 if entry.filename == 'payload' else 65536
                  if (entry.is_dir() or stat.S_IFMT(entry.external_attr >> 16) not in (0, stat.S_IFREG)
                          or not 0 < entry.file_size <= limit):
                      raise SystemExit('Invalid native qualification ZIP member')
                  with package.open(entry) as source, (root / entry.filename).open('xb') as output:
                      shutil.copyfileobj(source, output, length=65536)
          manifest = json.loads((root / 'app-release.json').read_bytes())
          identity = json.loads((root / 'artifact-identity.json').read_bytes())
          source = os.environ['GITHUB_SHA']
          counter = os.environ['GITHUB_RUN_NUMBER']
          if (not re.fullmatch('[1-9][0-9]{0,9}', counter) or int(counter) > 4294967295
                  or manifest.get('version') != f'1.0.0-alpha.{counter}'):
              raise SystemExit('Native candidate version differs from its publisher run number')
          if (set(identity) != {'schema', 'source_commit', 'sha256', 'bytes'}
                  or type(identity.get('schema')) is not int or identity.get('schema') != 1
                  or type(identity.get('bytes')) is not int
                  or identity.get('source_commit') != source or manifest['artifact']['app_source'] != source
                  or manifest['artifact']['native_source'] != source):
              raise SystemExit('Native source differs from the publisher workflow source')
          with (root / 'payload').open('rb') as payload:
              payload_digest = hashlib.file_digest(payload, 'sha256').hexdigest()
          size = (root / 'payload').stat().st_size
          if (identity.get('sha256') != payload_digest or identity.get('bytes') != size
                  or manifest['artifact']['sha256'] != payload_digest or manifest['artifact']['bytes'] != size):
              raise SystemExit('The original inner archive changed after its build')
          (root / 'actions-artifact.json').write_text(json.dumps(
              {'run_id': run, 'attempt': attempt, 'artifact_id': artifact['id'], 'digest': digest}, indent=2) + '\n')
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync
          ref: cc4ac03c777d902f38d8c73e7fc51a5a6a6453ed
          path: vendor/nds-contract
          persist-credentials: false
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r vendor/nds-contract/requirements-check.txt
      - name: Check the canonical Linux manifest contract
        run: python vendor/nds-contract/scripts/check-contracts.py --app-release "$RUNNER_TEMP/nds-native-authentication/app-release.json" --development-http
      - name: Authenticate the exact native manifest bytes
        id: attest-native
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ runner.temp }}/nds-native-authentication/app-release.json
      - name: Retain portable authentication and original artifact identity
        env:
          BUNDLE_PATH: ${{ steps.attest-native.outputs.bundle-path }}
        run: cp -- "$BUNDLE_PATH" "$RUNNER_TEMP/nds-native-authentication/app-release.sigstore.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nds-native-linux-authentication-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/nds-native-authentication/app-release.json
            ${{ runner.temp }}/nds-native-authentication/app-release.sigstore.json
            ${{ runner.temp }}/nds-native-authentication/actions-artifact.json
          if-no-files-found: error
          retention-days: 1
